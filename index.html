<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso 360 - Portales Mágicos y Terremoto</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .magical-hud {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fffa65;
            background: rgba(15, 20, 35, 0.88);
            border: 1px solid rgba(255, 211, 42, 0.55);
            padding: 10px 26px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 0.8px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65), 0 0 15px rgba(255, 211, 42, 0.3);
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
        }

        .magical-hud.quake-alert {
            color: #ff6b6b;
            border-color: rgba(255, 71, 87, 0.85);
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.55);
        }

        .felix-guide-container {
            position: absolute;
            bottom: 15px;
            left: 20px;
            display: flex;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none;
            animation: floatCharacter 3.5s ease-in-out infinite;
        }

        .felix-avatar {
            width: 145px;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.75));
            z-index: 2;
        }

        .speech-bubble {
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #f1f2f6 100%);
            color: #1e272e;
            padding: 14px 20px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            margin-left: -15px;
            margin-bottom: 55px;
            max-width: 270px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 0 3px #ffd32a;
            font-size: 14px;
            line-height: 1.4;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .speech-bubble.quake-bubble {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 0 3px #ff4757;
        }

        .speech-bubble strong {
            color: #0984e3;
            font-size: 15px;
            display: block;
            margin-bottom: 3px;
        }

        @keyframes floatCharacter {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        @media (max-width: 600px) {
            .felix-avatar { width: 105px; }
            .speech-bubble { max-width: 190px; font-size: 12px; margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div class="magical-hud" id="instruction">
        ✨ Apunta tu mirada al portal brillante para viajar de realidad ✨
    </div>

    <div class="felix-guide-container">
        <img src="felix.png" alt="Repara Félix" class="felix-avatar" onerror="this.src='image_db0ee8.png'">
        <div class="speech-bubble" id="felix-dialog">
            <strong>¡Hola, soy Repara Félix! 🔨✨</strong>
            <span id="felix-text">¡Con mi martillo dorado puedo reparar cualquier grieta dimensional! Mira fijamente los portales para cruzar.</span>
        </div>
    </div>

    <a-scene embedded>
        <a-assets>
            <img id="img-1" src="1.webp" crossorigin="anonymous">
            <img id="img-2" src="2.webp" crossorigin="anonymous">
            <img id="img-3" src="3.webp" crossorigin="anonymous">

            <canvas id="tex-vortex" width="512" height="512"></canvas>
            <canvas id="tex-runes" width="512" height="512"></canvas>
        </a-assets>

        <a-sky id="sky-sphere" src="#img-1" rotation="0 -90 0"></a-sky>

        <a-light type="ambient" color="#ffffff" intensity="0.85"></a-light>
        <a-light type="point" intensity="1.8" position="0 3 -2" color="#ffd32a"></a-light>

        <!-- Contenedor de dramatismo sísmico (ventanas y personas que caen) -->
        <a-entity id="earthquake-container"></a-entity>

        <!-- Contenedor dinámico de portales -->
        <a-entity id="portals-container"></a-entity>

        <!-- Rig de cámara con sacudida sísmica -->
        <a-entity id="camera-rig" position="0 1.6 0">
            <a-entity id="main-camera" camera look-controls>
                <a-cursor id="cursor"
                          fuse="true"
                          fuse-timeout="1200"
                          raycaster="objects: .portal-hitbox"
                          material="color: #ffd32a; shader: flat"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.014; radiusOuter: 0.024"
                          animation__fuse="property: scale; startEvents: fusing; to: 2 2 2; dur: 1200; easing: easeInOutQuad"
                          animation__mouseleave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
                </a-cursor>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        let quakeInterval = null;

        function generarTexturasMagicas() {
            const canvasVortex = document.getElementById('tex-vortex');
            const ctxV = canvasVortex.getContext('2d');
            const cx = 256, cy = 256;

            const grad = ctxV.createRadialGradient(cx, cy, 10, cx, cy, 250);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 211, 42, 0.85)');
            grad.addColorStop(0.65, 'rgba(255, 71, 87, 0.5)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctxV.fillStyle = grad;
            ctxV.fillRect(0, 0, 512, 512);

            ctxV.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctxV.lineWidth = 4;
            for (let i = 0; i < 6; i++) {
                ctxV.beginPath();
                for (let angle = 0; angle < Math.PI * 4; angle += 0.1) {
                    const r = angle * 18;
                    const x = cx + Math.cos(angle + (i * Math.PI / 3)) * r;
                    const y = cy + Math.sin(angle + (i * Math.PI / 3)) * r;
                    if (angle === 0) ctxV.moveTo(x, y);
                    else ctxV.lineTo(x, y);
                }
                ctxV.stroke();
            }

            const canvasRunes = document.getElementById('tex-runes');
            const ctxR = canvasRunes.getContext('2d');
            ctxR.strokeStyle = '#ffd32a';
            ctxR.lineWidth = 6;
            ctxR.setLineDash([20, 15, 5, 15]);
            ctxR.beginPath();
            ctxR.arc(cx, cy, 220, 0, Math.PI * 2);
            ctxR.stroke();

            for (let i = 0; i < 24; i++) {
                const a = (i / 24) * Math.PI * 2;
                const rx = cx + Math.cos(a) * 235;
                const ry = cy + Math.sin(a) * 235;
                ctxR.fillStyle = i % 2 === 0 ? '#ffffff' : '#ffd32a';
                ctxR.beginPath();
                ctxR.arc(rx, ry, i % 2 === 0 ? 5 : 3, 0, Math.PI * 2);
                ctxR.fill();
            }
        }

        // Construye una ventana 3D (marco + cristal translúcido) que vibra y cae con el temblor
        function crearVentanaCayendo(x, yStart, z, rotY, delay) {
            return `
                <a-entity position="${x} ${yStart} ${z}" rotation="0 ${rotY} 0"
                          animation__shake="property: rotation; from: 0 ${rotY} -10; to: 0 ${rotY} 10; dur: 90; dir: alternate; loop: true; delay: ${delay}"
                          animation__fall="property: position; to: ${x} -2.2 ${z}; dur: 2200; easing: easeInQuad; loop: true; delay: ${delay + 500}">
                    <!-- Marco de ventana -->
                    <a-box width="1.1" height="1.4" depth="0.08" material="color: #5d4037; roughness: 0.7"></a-box>
                    <!-- Cristal celeste translúcido -->
                    <a-plane width="0.92" height="1.22" position="0 0 0.045" material="color: #81ecec; opacity: 0.55; transparent: true; roughness: 0.1"></a-plane>
                    <!-- Travesaños -->
                    <a-box width="0.92" height="0.05" depth="0.09" position="0 0 0.04" material="color: #4e342e"></a-box>
                    <a-box width="0.05" height="1.22" depth="0.09" position="0 0 0.04" material="color: #4e342e"></a-box>
                </a-entity>
            `;
        }

        // Construye una figura humana estilizada (cabeza + torso + extremidades) que tambalea y cae al suelo
        function crearPersonaCayendo(x, z, rotY, colorCamisa, delay) {
            return `
                <a-entity position="${x} 0.9 ${z}" rotation="0 ${rotY} 0"
                          animation__wobble="property: rotation; from: -18 ${rotY} -14; to: 22 ${rotY} 16; dur: 140; dir: alternate; loop: true; delay: ${delay}"
                          animation__topple="property: rotation; to: 85 ${rotY} 25; dur: 1300; easing: easeInCubic; loop: true; delay: ${delay + 700}"
                          animation__drop="property: position; to: ${x} -1.1 ${z}; dur: 1300; easing: easeInCubic; loop: true; delay: ${delay + 700}">
                    <!-- Cabeza -->
                    <a-sphere radius="0.18" position="0 0.72 0" material="color: #ffccbc; roughness: 0.6"></a-sphere>
                    <!-- Torso -->
                    <a-cylinder radius="0.19" height="0.65" position="0 0.25 0" material="color: ${colorCamisa}; roughness: 0.7"></a-cylinder>
                    <!-- Brazo izquierdo en alto por el susto -->
                    <a-cylinder radius="0.06" height="0.55" position="-0.28 0.55 0" rotation="0 0 35" material="color: #ffccbc"></a-cylinder>
                    <!-- Brazo derecho -->
                    <a-cylinder radius="0.06" height="0.55" position="0.28 0.45 0" rotation="0 0 -25" material="color: #ffccbc"></a-cylinder>
                    <!-- Piernas -->
                    <a-cylinder radius="0.075" height="0.6" position="-0.1 -0.35 0" material="color: #2d3436"></a-cylinder>
                    <a-cylinder radius="0.075" height="0.6" position="0.1 -0.35 0" material="color: #2d3436"></a-cylinder>
                </a-entity>
            `;
        }

        function activarEfectoTerremoto(activo) {
            const eqContainer = document.querySelector('#earthquake-container');
            const camRig = document.querySelector('#camera-rig');
            const hud = document.querySelector('#instruction');
            const bubble = document.querySelector('#felix-dialog');

            if (quakeInterval) {
                clearInterval(quakeInterval);
                quakeInterval = null;
            }

            if (activo) {
                hud.classList.add('quake-alert');
                bubble.classList.add('quake-bubble');

                // Ventanas y personas cayendo alrededor de la escena
                eqContainer.innerHTML = `
                    ${crearVentanaCayendo(-2.5, 4.2, -4.2, 20, 0)}
                    ${crearVentanaCayendo(1.8, 4.8, -4.5, -15, 400)}
                    ${crearVentanaCayendo(4.2, 3.8, -2.5, -55, 800)}
                    ${crearVentanaCayendo(-4.2, 4.5, -2.0, 50, 1200)}

                    ${crearPersonaCayendo(-1.8, -3.6, 15, '#e17055', 150)}
                    ${crearPersonaCayendo(1.4, -3.4, -20, '#0984e3', 550)}
                    ${crearPersonaCayendo(3.5, -2.8, -35, '#00b894', 950)}
                    ${crearPersonaCayendo(-3.4, -2.6, 30, '#fdcb6e', 1350)}
                `;

                // Sacudida constante sutil de la cámara
                quakeInterval = setInterval(() => {
                    const dx = (Math.random() - 0.5) * 0.08;
                    const dy = 1.6 + (Math.random() - 0.5) * 0.08;
                    const dz = (Math.random() - 0.5) * 0.08;
                    camRig.setAttribute('position', `${dx.toFixed(3)} ${dy.toFixed(3)} ${dz.toFixed(3)}`);
                }, 50);
            } else {
                hud.classList.remove('quake-alert');
                bubble.classList.remove('quake-bubble');
                eqContainer.innerHTML = '';
                camRig.setAttribute('position', '0 1.6 0');
            }
        }

        function crearHTMLPortal(target, name, dialogMsg, pos, rot, colorHex) {
            return `
                <a-entity position="${pos}" rotation="${rot}"
                          animation="property: position; dir: alternate; dur: 2500; easing: easeInOutSine; loop: true; to: ${pos.split(' ')[0]} ${parseFloat(pos.split(' ')[1]) + 0.15} ${pos.split(' ')[2]}">
                    
                    <a-circle class="portal-hitbox" 
                              data-target="${target}" 
                              data-name="${name}" 
                              data-felix="${dialogMsg}"
                              radius="1.15" 
                              material="opacity: 0; transparent: true; side: double">
                    </a-circle>

                    <a-circle radius="0.95" 
                              material="src: #tex-vortex; color: ${colorHex}; transparent: true; side: double; shader: flat"
                              animation="property: rotation; to: 0 0 -360; loop: true; dur: 6000; easing: linear">
                    </a-circle>

                    <a-plane width="2.4" height="2.4" 
                             position="0 0 0.02"
                             material="src: #tex-runes; transparent: true; side: double; shader: flat"
                             animation="property: rotation; to: 0 0 360; loop: true; dur: 14000; easing: linear">
                    </a-plane>

                    <a-torus radius="0.98" radius-tubular="0.025" 
                             material="color: #ffd32a; emissive: #ffa801; emissiveIntensity: 0.8; metalness: 0.6; roughness: 0.2">
                    </a-torus>

                    <a-entity position="0 1.35 0">
                        <a-plane width="2.2" height="0.38" material="color: #0f1423; opacity: 0.85; transparent: true"></a-plane>
                        <a-text value="${name}" align="center" position="0 0 0.02" scale="1.1 1.1 1.1" color="#ffd32a"></a-text>
                    </a-entity>
                </a-entity>
            `;
        }

        function actualizarEscena(currentImage) {
            const container = document.querySelector('#portals-container');
            let html = '';

            if (currentImage === '1.webp') {
                activarEfectoTerremoto(false);
                html += crearHTMLPortal(
                    '2.webp', 
                    'Ir a Terremoto Volcánico (2)', 
                    '¡¡Lo reparé!! ¡Cuidado, aquí hay un terremoto! ¡Las ventanas y la gente están cayendo!',
                    '3 1.6 -3.5', 
                    '0 -35 0', 
                    '#ff4757'
                );
            } else if (currentImage === '2.webp') {
                activarEfectoTerremoto(true);
                html += crearHTMLPortal(
                    '1.webp', 
                    'Volver a Playa Ruinas (1)', 
                    '¡Vamos a la Playa de las Ruinas antes de que caiga otra ventana! ¡Rápido al portal!',
                    '-3.2 1.6 -3.2', 
                    '0 40 0', 
                    '#1e90ff'
                );
                html += crearHTMLPortal(
                    '3.webp', 
                    'Ir a Costa en Temblor (3)', 
                    '¡El temblor sigue fuerte en la Costa! ¡Agárrate bien mientras cruzamos!',
                    '3.2 1.6 -3.2', 
                    '0 -40 0', 
                    '#ffa502'
                );
            } else if (currentImage === '3.webp') {
                activarEfectoTerremoto(true);
                html += crearHTMLPortal(
                    '2.webp', 
                    'Volver a Terremoto Volcánico (2)', 
                    '¡Regresamos al sector del volcán! ¡Mantén la vista firme en el portal para estabilizarlo!',
                    '-3 1.6 -3.5', 
                    '0 35 0', 
                    '#ff4757'
                );
            }

            container.innerHTML = html;
        }

        document.addEventListener("DOMContentLoaded", () => {
            generarTexturasMagicas();
            actualizarEscena('1.webp');

            const container = document.querySelector('#portals-container');
            const sky = document.querySelector('#sky-sphere');
            const instruction = document.querySelector('#instruction');
            const felixText = document.querySelector('#felix-text');

            container.addEventListener('click', (evt) => {
                const hitbox = evt.target.closest('.portal-hitbox');
                if (!hitbox) return;

                const targetImage = hitbox.getAttribute('data-target');
                const targetName = hitbox.getAttribute('data-name');
                const nuevoDialogo = hitbox.getAttribute('data-felix');

                if (targetImage && sky) {
                    sky.setAttribute('src', targetImage);
                    instruction.innerText = `🌌 Realidad actual: ${targetName} 🌌`;
                    instruction.style.color = "#fffa65";
                    felixText.innerText = nuevoDialogo;
                    actualizarEscena(targetImage);
                }
            });

            container.addEventListener('fusing', (evt) => {
                if (evt.target.closest('.portal-hitbox')) {
                    instruction.innerText = "🔨✨ Repara Félix está abriendo el portal... ✨🔨";
                    instruction.style.color = "#2ed573";
                }
            }, true);

            container.addEventListener('mouseleave', (evt) => {
                if (evt.target.closest('.portal-hitbox')) {
                    instruction.innerText = "✨ Apunta tu mirada al portal brillante para viajar de realidad ✨";
                    instruction.style.color = "#fffa65";
                }
            }, true);
        });
    </script>
</body>
</html>
